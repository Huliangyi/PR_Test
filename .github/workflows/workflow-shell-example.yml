name: Job Summary - 方式一 Shell 示例

on:
  workflow_dispatch:

jobs:
  summary-demo:
    runs-on: ubuntu-latest
    steps:
      - name: 生成测试报告（折叠区域）
        run: |
          echo "# 📊 测试报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "<details><summary>✅ 单元测试结果（共 12 项）</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 模块 | 通过 | 失败 | 耗时 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| UserService | 12 | 0 | 1.2s |" >> $GITHUB_STEP_SUMMARY
          echo "| OrderService | 8 | 0 | 0.8s |" >> $GITHUB_STEP_SUMMARY
          echo "| PaymentService | 15 | 0 | 2.1s |" >> $GITHUB_STEP_SUMMARY
          echo "| NotificationService | 5 | 0 | 0.3s |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "<details><summary>🔍 代码检查结果</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 规则 | 文件 | 级别 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| no-unused-vars | src/index.ts | ⚠️ Warning |" >> $GITHUB_STEP_SUMMARY
          echo "| no-console | src/debug.ts | ⚠️ Warning |" >> $GITHUB_STEP_SUMMARY
          echo "| prefer-const | src/utils.ts | ⚠️ Warning |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "<details><summary>🚀 部署详情</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**目标环境**: production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本**: v2.1.0" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**状态**: ✅ 部署成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**访问地址**: https://app.example.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: 查看 Summary
        run: |
          echo "Job Summary 已生成，请查看页面上的渲染效果。"
          echo "每个 <details> 区域默认收起，点击标题可展开查看详情。"
